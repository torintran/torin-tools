apiVersion: v1
kind: Namespace
metadata:
  name: torin-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torin-tools
  namespace: torin-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torin-tools
  template:
    metadata:
      labels:
        app: torin-tools
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/torintran/torin-tools:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTMAN_GATEWAY_ENABLED
              value: "0"
          ports:
            - name: http
              containerPort: 4173
          readinessProbe:
            httpGet:
              path: /version.json
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /version.json
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: torin-tools
  namespace: torin-tools
spec:
  type: ClusterIP
  selector:
    app: torin-tools
  ports:
    - name: http
      port: 80
      targetPort: http
